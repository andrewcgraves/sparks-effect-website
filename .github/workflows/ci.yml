name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  # One job rather than two. The build used to live in a separate job that
  # `needs:` the test job — so it never overlapped with it, and every run paid
  # for a second runner, checkout, Node setup and `npm ci` just to arrive at a
  # working tree identical to the one the first job already had. Steps in a
  # single job give the same ordering guarantee for one install: a failing lint
  # or test still stops the build.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # `build` is `vue-tsc -b && vite build`, so this covers the typecheck too.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Staging is whatever `trunk` last passed CI (Vercel already deploys it).
  # Linear's staging pipeline is a separate stream from production because
  # the two environments can hold different commits at the same time —
  # see docs/releases.md.
  linear-staging:
    name: Record staging release in Linear
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # linear-release-action scans commits since the last Linear release,
          # which needs the full history.
          fetch-depth: 0

      # Secrets cannot be referenced in `if:` (GitHub treats that as a
      # workflow-file error), so the empty check lives in a shell step and
      # gates the action via an output.
      - name: Check for the staging pipeline key
        id: linear
        env:
          LINEAR_ACCESS_KEY_STAGING: ${{ secrets.LINEAR_ACCESS_KEY_STAGING }}
        run: |
          set -euo pipefail
          if [[ -z "${LINEAR_ACCESS_KEY_STAGING:-}" ]]; then
            echo "::notice::LINEAR_ACCESS_KEY_STAGING is not set — create the Website Build Staging pipeline key and add it as this repository secret"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Linear staging release
        if: steps.linear.outputs.configured == 'true'
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_STAGING }}
          links: |
            CI run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
