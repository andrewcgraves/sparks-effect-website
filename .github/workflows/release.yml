name: Release

# Production is reached by tagging a commit, and by nothing else.
#
# The tag names a commit that is already on `trunk` and that Vercel already
# built and served as staging. This workflow never builds: it points Vercel's
# production domains at that existing deployment. A tag that does not point
# into `trunk`'s history is refused, so a feature branch has no path to
# production even if someone tags it.
#
# Vercel's own git integration must not treat `trunk` as the production branch —
# otherwise a merge ships to production behind this workflow's back. See
# `docs/releases.md`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to promote, e.g. v1.4.2. Pass an older tag to roll back."
        required: true
        type: string

# Two promotions racing would leave production on whichever alias switch landed
# last rather than whichever was asked for last.
concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote deployment to production
    runs-on: ubuntu-latest
    # Scopes the Vercel credential to production and gives the repo one place to
    # require an approval before prd moves.
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # `vercel` reads these two from the environment to know which project it
      # is acting on, so they are set job-wide rather than per step.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry check below is what keeps a tag on a feature branch out
          # of production, and it needs the full history to answer.
          fetch-depth: 0

      - name: Resolve the tag and the commit it points at
        id: target
        env:
          # Empty on a tag push, in which case the pushed tag is the target.
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          if ! git fetch --force origin "refs/tags/$tag:refs/tags/$tag"; then
            echo "::error::tag '$tag' does not exist"
            exit 1
          fi

          # rev-list dereferences an annotated tag to the commit it wraps; using
          # the ref directly would hand the tag object's own SHA to the checks.
          sha="$(git rev-list -n 1 "refs/tags/$tag")"

          git fetch --no-tags origin trunk
          if ! git merge-base --is-ancestor "$sha" origin/trunk; then
            echo "::error::$tag points at $sha, which is not on trunk — refusing to promote"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Find the deployment Vercel built from that commit
        id: deployment
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          query="projectId=$VERCEL_PROJECT_ID&state=READY&limit=100&meta-githubCommitSha=$SHA"
          # A personal account's org id is a user id, which this endpoint rejects
          # as a teamId; only a team's belongs on the query.
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            query="$query&teamId=$VERCEL_ORG_ID"
          fi

          response="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?$query")"

          # Newest first: a commit can have been deployed more than once (a
          # retried build), and the last successful one is what staging served.
          uid="$(jq -r '[.deployments[]] | sort_by(.created) | reverse | .[0].uid // empty' <<<"$response")"
          url="$(jq -r '[.deployments[]] | sort_by(.created) | reverse | .[0].url // empty' <<<"$response")"

          if [[ -z "$uid" ]]; then
            echo "::error::no ready Vercel deployment for $SHA — nothing built from that commit to promote"
            exit 1
          fi

          {
            echo "uid=$uid"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"

      # Promotion re-serves the build staging already ran — it does not rebuild,
      # so what production serves is byte-for-byte what was verified.
      #
      # Promoted over HTTP rather than with `vercel promote`: before it will act,
      # the CLI resolves a scope name, and that resolution reads the
      # account-level /v2/user. A token scoped to a single project cannot address
      # that endpoint, so the read 404s and the CLI reports "User not found"
      # without ever attempting the promotion. The REST call needs only the
      # project and team ids we already hold, which lets the token stay scoped to
      # this project alone.
      - name: Promote it to production
        env:
          UID: ${{ steps.deployment.outputs.uid }}
        run: |
          set -euo pipefail
          promote_url="https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$UID"
          status_url="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?rollbackInfo=true"

          # A personal account's org id is a user id, which these endpoints reject
          # as a teamId; only a team's belongs on the query.
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            promote_url="$promote_url?teamId=$VERCEL_ORG_ID"
            status_url="$status_url&teamId=$VERCEL_ORG_ID"
          fi

          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$promote_url" > /dev/null

          # The POST only queues the alias move, so a 2xx on its own would let a
          # promotion that later failed still pass as a green release. The
          # outcome lands on the project's lastAliasRequest, which is what
          # `rollbackInfo=true` surfaces.
          status=""
          target=""
          for _ in $(seq 60); do
            request="$(curl -sS --fail-with-body \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$status_url" | jq -c '.lastAliasRequest // {}')"

            status="$(jq -r '.jobStatus // empty' <<<"$request")"
            target="$(jq -r '.toDeploymentId // empty' <<<"$request")"

            if [[ "$target" == "$UID" && "$status" != "pending" && "$status" != "in-progress" ]]; then
              break
            fi
            sleep 5
          done

          if [[ "$target" != "$UID" ]]; then
            echo "::error::production's last alias request targets '${target:-none}', not $UID"
            exit 1
          fi

          case "$status" in
            succeeded)
              ;;
            skipped)
              echo "::notice::promotion skipped — production already served $UID"
              ;;
            *)
              echo "::error::promotion of $UID finished as '${status:-unknown}'"
              exit 1
              ;;
          esac

      - name: Summarise
        env:
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
          URL: ${{ steps.deployment.outputs.url }}
          UID: ${{ steps.deployment.outputs.uid }}
        run: |
          {
            echo "### Promoted \`$TAG\` to production"
            echo
            echo "- commit: \`$SHA\`"
            echo "- deployment: \`$UID\` (https://$URL)"
          } >> "$GITHUB_STEP_SUMMARY"
