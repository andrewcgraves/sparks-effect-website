name: Release

# Production is reached by tagging a commit, and by nothing else.
#
# The tag names a commit that is already on `trunk` and that Vercel already
# built and served as staging. This workflow never builds: it points Vercel's
# production domains at that existing deployment. A tag that does not point
# into `trunk`'s history is refused, so a feature branch has no path to
# production even if someone tags it.
#
# Vercel's own git integration must not treat `trunk` as the production branch —
# otherwise a merge ships to production behind this workflow's back. See
# `docs/releases.md`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to promote, e.g. v1.4.2. Pass an older tag to roll back."
        required: true
        type: string
      base_ref:
        description: "Optional exclusive git ref for Linear's commit scan (e.g. v0.1.0). Leave empty to use the last Linear release in the production pipeline."
        required: false
        type: string

# Two promotions racing would leave production on whichever alias switch landed
# last rather than whichever was asked for last.
concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote deployment to production
    runs-on: ubuntu-latest
    # Scopes the Vercel credential to production and gives the repo one place to
    # require an approval before prd moves.
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # `vercel` reads these two from the environment to know which project it
      # is acting on, so they are set job-wide rather than per step.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry check below is what keeps a tag on a feature branch out
          # of production, and it needs the full history to answer.
          fetch-depth: 0

      - name: Resolve the tag and the commit it points at
        id: target
        env:
          # Empty on a tag push, in which case the pushed tag is the target.
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          if ! git fetch --force origin "refs/tags/$tag:refs/tags/$tag"; then
            echo "::error::tag '$tag' does not exist"
            exit 1
          fi

          # rev-list dereferences an annotated tag to the commit it wraps; using
          # the ref directly would hand the tag object's own SHA to the checks.
          sha="$(git rev-list -n 1 "refs/tags/$tag")"

          git fetch --no-tags origin trunk
          if ! git merge-base --is-ancestor "$sha" origin/trunk; then
            echo "::error::$tag points at $sha, which is not on trunk — refusing to promote"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Find the deployment Vercel built from that commit
        id: deployment
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          query="projectId=$VERCEL_PROJECT_ID&state=READY&limit=100&meta-githubCommitSha=$SHA"
          # A personal account's org id is a user id, which this endpoint rejects
          # as a teamId; only a team's belongs on the query.
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            query="$query&teamId=$VERCEL_ORG_ID"
          fi

          response="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?$query")"

          # Newest first: a commit can have been deployed more than once (a
          # retried build), and the last successful one is what staging served.
          uid="$(jq -r '[.deployments[]] | sort_by(.created) | reverse | .[0].uid // empty' <<<"$response")"
          url="$(jq -r '[.deployments[]] | sort_by(.created) | reverse | .[0].url // empty' <<<"$response")"

          if [[ -z "$uid" ]]; then
            echo "::error::no ready Vercel deployment for $SHA — nothing built from that commit to promote"
            exit 1
          fi

          {
            echo "uid=$uid"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"

      # Promoted over HTTP rather than with `vercel promote`: before it will act,
      # the CLI resolves a scope name, and that resolution reads the
      # account-level /v2/user. A token scoped to a single project cannot address
      # that endpoint, so the read 404s and the CLI reports "User not found"
      # without ever attempting the promotion. The REST calls need only the
      # project and team ids we already hold, which lets the token stay scoped to
      # this project alone.
      #
      # Which call promotes depends on what the deployment was built as, exactly
      # as the CLI decides it. /promote only accepts a deployment already built
      # for production and answers 422 for anything else, and `trunk` is the
      # staging branch here — see docs/releases.md.
      - name: Promote it to production
        env:
          UID: ${{ steps.deployment.outputs.uid }}
        run: |
          set -euo pipefail

          # A personal account's org id is a user id, which these endpoints
          # reject as a teamId; only a team's belongs on the query.
          team_q=""
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            team_q="?teamId=$VERCEL_ORG_ID"
          fi

          # Vercel explains a 4xx in the response body, which plain --fail throws
          # away; without this a failure reads only as an exit code.
          api() {
            local out
            if ! out="$(curl -sS --fail-with-body "$@")"; then
              echo "::error::Vercel API call failed: $out" >&2
              return 1
            fi
            printf '%s' "$out"
          }

          deployment="$(api -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$UID$team_q")"
          target="$(jq -r '.target // empty' <<<"$deployment")"

          if [[ "$target" == "production" ]]; then
            # Already a production build, so promoting only moves the domains.
            # Nothing rebuilds: production serves the artifact staging verified.
            api -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$UID$team_q" > /dev/null

            # The POST only queues the alias move, so a 2xx on its own would let
            # a promotion that later failed still pass as a green release. The
            # outcome lands on the project's lastAliasRequest, which is what
            # `rollbackInfo=true` surfaces.
            status=""
            promoted=""
            status_url="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?rollbackInfo=true${team_q:+&teamId=$VERCEL_ORG_ID}"
            for _ in $(seq 60); do
              request="$(api -H "Authorization: Bearer $VERCEL_TOKEN" "$status_url" \
                | jq -c '.lastAliasRequest // {}')"
              status="$(jq -r '.jobStatus // empty' <<<"$request")"
              promoted="$(jq -r '.toDeploymentId // empty' <<<"$request")"

              if [[ "$promoted" == "$UID" && "$status" != "pending" && "$status" != "in-progress" ]]; then
                break
              fi
              sleep 5
            done

            if [[ "$promoted" != "$UID" ]]; then
              echo "::error::production's last alias request targets '${promoted:-none}', not $UID"
              exit 1
            fi

            case "$status" in
              succeeded)
                ;;
              skipped)
                echo "::notice::promotion skipped — production already served $UID"
                ;;
              *)
                echo "::error::promotion of $UID finished as '${status:-unknown}'"
                exit 1
                ;;
            esac
          else
            # Built for staging, so Vercel will only move it to production by
            # creating a production deployment from it — the same request
            # `vercel promote --yes` makes. Per docs/releases.md this is
            # byte-for-byte only while `trunk` builds with production's
            # environment variables; otherwise Vercel rebuilds here.
            echo "::notice::$UID was built for '${target:-preview}', creating a production deployment from it"

            created="$(api -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg d "$UID" --arg n "$(jq -r '.name' <<<"$deployment")" \
                    '{deploymentId:$d,name:$n,target:"production",meta:{action:"promote"}}')" \
              "https://api.vercel.com/v13/deployments$team_q")"

            new_id="$(jq -r '.id' <<<"$created")"
            echo "production deployment $new_id created from $UID"

            # The CLI returns as soon as the request is accepted. That would let
            # a release go green while the build it just queued is still running,
            # so wait for the deployment that production will actually serve.
            state=""
            for _ in $(seq 120); do
              state="$(api -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$new_id$team_q" \
                | jq -r '.readyState // .status // empty')"
              case "$state" in
                READY)
                  break
                  ;;
                ERROR|CANCELED)
                  echo "::error::production deployment $new_id ended as $state"
                  exit 1
                  ;;
              esac
              sleep 5
            done

            if [[ "$state" != "READY" ]]; then
              echo "::error::production deployment $new_id did not become READY (last state '${state:-unknown}')"
              exit 1
            fi
          fi

      # Linear scans this working tree, so it must be the promoted commit —
      # not `trunk`. A tag push already checks out that SHA; workflow_dispatch
      # of an older tag would otherwise scan trunk HEAD and attach issues
      # that are not in the promoted deployment.
      - name: Check out the promoted commit
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: git checkout --detach "$SHA"

      # Production is a different Linear pipeline from staging: the same issue
      # can sit on staging for a while before a tag promotes it, and staging
      # can already be several commits ahead. See docs/releases.md.
      #
      # Secrets cannot be referenced in `if:` (GitHub treats that as a
      # workflow-file error), so the empty check lives in a shell step.
      - name: Check for the production pipeline key
        id: linear
        env:
          LINEAR_ACCESS_KEY_PRODUCTION: ${{ secrets.LINEAR_ACCESS_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          if [[ -z "${LINEAR_ACCESS_KEY_PRODUCTION:-}" ]]; then
            echo "::notice::LINEAR_ACCESS_KEY_PRODUCTION is not set — add the Website Build Production access key as a secret on the production environment"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Two steps because `base_ref` has no "unset" value once written — passing
      # it empty would scan from nothing rather than from the last Linear
      # release. The pair is mutually exclusive: the second only runs when a
      # workflow_dispatch supplied a base_ref, which is how a promoted tag gets
      # backfilled.
      - name: Sync Linear production release
        if: steps.linear.outputs.configured == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.base_ref == '')
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_PRODUCTION }}
          name: ${{ steps.target.outputs.tag }}
          version: ${{ steps.target.outputs.tag }}
          links: |
            Commit=${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.target.outputs.sha }}
            CI run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Sync Linear production release with explicit scan base
        if: steps.linear.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.base_ref != ''
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_PRODUCTION }}
          name: ${{ steps.target.outputs.tag }}
          version: ${{ steps.target.outputs.tag }}
          base_ref: ${{ github.event.inputs.base_ref }}
          links: |
            Commit=${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.target.outputs.sha }}
            CI run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Summarise
        env:
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
          URL: ${{ steps.deployment.outputs.url }}
          UID: ${{ steps.deployment.outputs.uid }}
        run: |
          {
            echo "### Promoted \`$TAG\` to production"
            echo
            echo "- commit: \`$SHA\`"
            echo "- deployment: \`$UID\` (https://$URL)"
          } >> "$GITHUB_STEP_SUMMARY"
